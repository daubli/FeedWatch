name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true
          local-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget

      - name: Cache NDI Android SDK
        id: cache-ndi
        uses: actions/cache@v4
        with:
          path: "NDI SDK*"
          key: ${{ runner.os }}-ndi-android-v6

      - name: Setup NDI Android SDK
        if: steps.cache-ndi.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          wget https://downloads.ndi.tv/SDK/NDI_SDK_Android/Install_NDI_SDK_v6_Android.tar.gz
          tar -xvf Install_NDI_SDK_v6_Android.tar.gz

          chmod +x Install_NDI_SDK_v6_Android.sh
          sed -i 's/read -p/cat/g' Install_NDI_SDK_v6_Android.sh

          PAGER=cat REPLY=y ./Install_NDI_SDK_v6_Android.sh

          rm -f Install_NDI_SDK_v6_Android.tar.gz
          rm -f Install_NDI_SDK_v6_Android.sh

      - name: Copy NDI Android files into project
        run: |
          set -euo pipefail

          NDI_DIR="$(find "$GITHUB_WORKSPACE" -type d -name 'NDI SDK for Android' | head -n 1)"

          echo "NDI_DIR=$NDI_DIR"

          if [ -z "$NDI_DIR" ]; then
            echo "NDI SDK for Android directory not found"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type d
            exit 1
          fi

          mkdir -p app/src/main/cpp/include
          mkdir -p app/src/main/jniLibs

          cp -R "$NDI_DIR/include/"* app/src/main/cpp/include/
          cp -R "$NDI_DIR/lib/"* app/src/main/jniLibs/

          echo "Copied NDI headers:"
          ls -la app/src/main/cpp/include

          echo "Copied NDI libraries:"
          find app/src/main/jniLibs -type f -name "*.so" -print

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Validate signing secrets
        run: |
          set -euo pipefail

          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Decode Android signing keystore
        run: |
          set -euo pipefail
          set +x

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Sign release APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          VERSION="${GITHUB_REF_NAME//\//-}"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/feedwatch-$VERSION.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

      - name: Generate and log APK checksum
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME//\//-}"
          APK="app/build/outputs/apk/release/feedwatch-$VERSION.apk"

          echo "APK file: $APK"
          echo "SHA256 checksum:"
          sha256sum "$APK" | tee apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/feedwatch-${{ github.ref_name }}.apk
            apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean signing files
        if: always()
        run: |
          rm -f release.keystore aligned.apk
