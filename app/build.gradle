plugins {
    id 'com.android.application'
}

// first 16 characters of the HEAD commit, shown as build identifier on the About page
def gitCommit() {
    try {
        def process = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir)
        def hash = process.text.trim()
        return process.waitFor() == 0 && hash ? hash.take(16) : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    compileSdk 33

    viewBinding {
        enabled = true
    }

    buildFeatures {
        // Oboe ships its native library as a prefab package
        prefab true
    }

    sourceSets {
        main {
            // The libs directory contains prebuilt libraries that are used by the
            // app's library defined in CMakeLists.txt via an IMPORTED target.
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId "de.daubli.feedwatch"
        minSdk 25
        targetSdk 33
        versionCode 3
        versionName "1.2.0"
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // required by the Oboe prefab package; libndi links its own C++ runtime statically
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "27.3.13750724"

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged manifest and resources
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.oboe:oboe:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'androidx.test:core:1.5.0'
}
