plugins {
    id 'com.android.application'
}

// first 16 characters of the HEAD commit, shown as build identifier on the About page
def gitCommit() {
    try {
        def process = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir)
        def hash = process.text.trim()
        return process.waitFor() == 0 && hash ? hash.take(16) : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    namespace "de.daubli.feedwatch"
    compileSdk 36

    buildFeatures {
        viewBinding true
        buildConfig true
        // Oboe ships its native library as a prefab package
        prefab true
        buildConfig true
    }

    sourceSets {
        main {
            // The libs directory contains prebuilt libraries that are used by the
            // app's library defined in CMakeLists.txt via an IMPORTED target.
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId "de.daubli.feedwatch"
        minSdk 25
        targetSdk 36
        versionCode 5
        versionName "1.2.2"
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // required by the Oboe prefab package; libndi links its own C++ runtime statically
                // flexible page sizes align libndi-wrapper.so to 16 KB for devices with 16 KB pages (Android 17)
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "27.3.13750724"

    packaging {
        jniLibs {
            // Compressed libraries are extracted on install, so only their LOAD segments need 16 KB alignment,
            // and the APK stays a third of the size
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged manifest and resources
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.oboe:oboe:1.9.3'
    // UVC capture through libuvc: supports isochronous endpoints and all UVC frame formats.
    // UVCAndroid 1.0.13 with a fix for bulk cards, see libs/README.md
    implementation files('libs/UVCAndroid-1.0.13-feedwatch.aar')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'androidx.test:core:1.5.0'
}
